name: Build & Release

on:
  push:
    branches: [main, beta]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same PR/branch cancels the older run; tag builds are never cancelled.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Android SDK path
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_STORE_PASSWORD:-}" ] \
             && [ -n "${RELEASE_KEY_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Secrets missing — debug signing fallback."
            # Forks and contributors build debug-signed. Only the official repo must sign releases.
            if [ "$IS_RELEASE" = "true" ] && [ "$GITHUB_REPOSITORY" = "wized2/Latch" ]; then
              echo "::error::Release tag without signing secrets; refusing to publish a debug-signed APK."
              exit 1
            fi
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testStableDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            export RELEASE_STORE_FILE="$GITHUB_WORKSPACE/release.jks"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleStableRelease --stacktrace
          else
            ./gradlew assembleStableDebug assembleBetaDebug assembleStableRelease assembleBetaRelease --stacktrace
          fi
          ls -la app/build/outputs/apk/stable/release/ app/build/outputs/apk/beta/release/ || true

      - name: Verify APK signature
        if: steps.keystore.outputs.present == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/stable/release/*.apk; do
            "$APKSIGNER" verify --verbose "$f"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Latch-release
          path: app/build/outputs/apk/stable/release/*.apk

      - name: Version
        if: env.IS_RELEASE == 'true'
        id: ver
        run: |
          VN=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"

      - name: Prepare assets
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/stable/release/*.apk release-assets/Latch-release.apk

      - name: GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Latch ${{ steps.ver.outputs.name }}
          files: release-assets/Latch-release.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
